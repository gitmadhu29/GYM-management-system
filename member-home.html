<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Member Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">🏋️ GymPro</div>
        <ul class="nav-links">
            <li><a href="member-home.html" class="active">Home</a></li>
